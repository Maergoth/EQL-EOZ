<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'self'; worker-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eye of Zomm overlay</title>
<link rel="stylesheet" href="./overlay.css">
</head>
<body>
<main id="overlay" class="overlay-shell" aria-label="Eye of Zomm overlay">
    <header id="overlay-header" class="overlay-header">
        <h1 id="overlay-title">Eye of Zomm</h1>
        <select id="encounter-scope" aria-label="Encounter selection" hidden></select>
        <span id="encounter-stats" class="encounter-stats" hidden></span>
        <div class="hover-menu">
            <button id="panel-menu-button" class="chrome-button" type="button" aria-label="Panel controls" aria-expanded="false" aria-controls="panel-menu">☷</button>
            <div id="panel-menu" class="panel-menu" role="group" aria-label="Panel controls">
                <label><input id="layout-lock" type="checkbox"> Lock layout</label>
                <label><input id="ignore-mouse" type="checkbox"> Ignore mouse</label>
                <label>Background <input id="panel-opacity" type="range" min="0.15" max="1" step="0.05"></label>
                <label>Text size <select id="panel-font"><option value="0.85">Small</option><option value="1">Normal</option><option value="1.15">Large</option><option value="1.3">Largest</option></select></label>
                <button type="button" data-command="show-main">Open main app</button>
                <button type="button" data-open-view="settings">Settings</button>
                <button type="button" data-command="hide">Hide panel</button>
            </div>
        </div>
    </header>
    <div id="session-restart" class="restart-note" role="status" hidden>Session restarted · parse rebuilt from log tail; timer deadlines restored.</div>
    <section id="panel-content" class="panel-content" aria-label="Panel content"></section>
    <footer id="overlay-status" role="status" aria-live="polite"></footer>
</main>
<script type="module" src="./overlay.js"></script>
</body>
</html>
