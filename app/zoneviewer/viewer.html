<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eye of Zomm - Zone Viewer</title>
<link rel="stylesheet" href="./ext.eqlZoneViewer.css">
<style>
html,body{margin:0;height:100%;background:#08101b;overflow:hidden}
.eqlzv-root{height:100%;min-height:0;margin:0;overflow:hidden}
.eqlzv-app{height:100%;min-height:0;box-sizing:border-box;border:0;border-radius:0}
.eqlzv-viewport{flex:1;min-height:0}
.eqlzv-toolbar,.eqlzv-status{flex:0 0 auto}
.eqlzv-status{grid-template-columns:minmax(0,1fr) minmax(45px,16%) auto}
.eqlzv-status-text{min-width:0;overflow-wrap:anywhere}
.eqlzv-status progress{grid-column:auto;grid-row:auto}
@media(max-height:400px){.eqlzv-toolbar{box-sizing:border-box;min-height:42px;padding:5px 7px!important}.eqlzv-toolbar .eqlzv-button,.eqlzv-toolbar .eqlzv-select{min-height:30px;font-size:12px}}
.eqlzv-minimap{pointer-events:auto;max-height:calc(100% - 45px);bottom:36px}
.eqlzv-minimap-title{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:0 5px}
.eoz-minimap-controls{display:flex;align-items:center;gap:3px}
.eoz-minimap-controls button{height:20px;min-width:23px;padding:0 4px;border:1px solid #b591494f;border-radius:3px;background:#15201f;color:#eee6d3;font:600 11px system-ui,sans-serif;cursor:pointer}
.eoz-minimap-controls button:focus-visible{outline:2px solid #f0d77f;outline-offset:1px}
.eoz-auto-z[aria-pressed="true"]{border-color:#6cdff5;color:#a7f0ff;background:#16343d}
/* Eye of Zomm keeps the viewer focused on navigation. Advanced diagnostics
   and display tuning remain in the upstream source but are not exposed here. */
.eqlzv-source-label,.eqlzv-world-button,.eqlzv-goto-label,.eqlzv-slider-label,
.eqlzv-options,.eqlzv-performance,.eqlzv-performance-panel,.eqlzv-help-panel,
.eqlzv-control-hint{display:none!important}
.eqlzv-toolbar>.eqlzv-primary,.eqlzv-toolbar>.eqlzv-toolbar-label,
.eqlzv-toolbar>.eqlzv-segmented{display:none!important}
.eqlzv-toolbar{gap:8px!important;flex-wrap:wrap}
.eqlzv-toolbar-secondary{padding-top:6px!important}
.eoz-rare-layer{position:absolute;inset:0;z-index:18;overflow:hidden;pointer-events:none}
.eoz-rare-marker{position:absolute;max-width:220px;border:1px solid rgba(240,199,73,.72);border-radius:999px;background:rgba(8,14,22,.9);box-shadow:0 3px 13px rgba(0,0,0,.62);color:#f4d66e;padding:4px 8px;font:700 11px/1.2 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer}
.eoz-rare-marker:hover,.eoz-rare-marker:focus-visible,.eoz-rare-marker.is-active{border-color:#fff0a6;background:rgba(76,58,15,.95);color:#fff6c9;outline:none}
.eoz-rare-marker small{margin-left:5px;color:#a9b4bf;font:600 8px/1.2 system-ui,sans-serif}
.eoz-rare-marker.is-raid{border-color:#cd8189;color:#efbdc3;background:rgba(35,13,23,.92)}
.eoz-route-guidance{position:absolute;z-index:22;top:12px;left:50%;transform:translateX(-50%);min-width:220px;max-width:min(520px,calc(100% - 28px));border:1px solid rgba(240,199,73,.66);border-radius:10px;background:rgba(8,14,22,.92);box-shadow:0 5px 20px rgba(0,0,0,.55);padding:7px 12px;color:#fff6c9;text-align:center;pointer-events:none;font-family:system-ui,sans-serif}
.eoz-route-guidance[hidden]{display:none}
.eoz-route-guidance strong{display:block;color:#f4d66e;font:700 14px/1.25 Georgia,serif}
.eoz-route-guidance small{display:block;margin-top:2px;color:#c0c9d2;font:600 10px/1.2 system-ui,sans-serif}
</style>
</head>
<body>
<div id="zone-root" class="eqlzv-root"></div>
<script type="module">
import { mountZoneViewer } from './ZoneViewerApp.js';
import navigationPolicy, { configureViewerMovement } from '../navigation-policy.js';
import { LocationHeadingTracker } from '../movement-tracking.js';
import { routeDistanceLabel, routeGuidance } from '../route-guidance.js';
import { formatWorldLocationForGameMap, worldToClientMap } from '../coordinate-system.js';
import { RecastRouteClient } from '../recast-route-client.js';
import { cropCollisionGeometryForRoute, exportViewerCollisionGeometry } from '../collision-geometry.js';
import { certifyDirectDrop } from '../drop-certification.js';
import { installEstablishedRouteGuard } from '../established-route-guard.js';
import { deferHiddenViewportFit } from '../viewport-framing.js';
import { installZoneLoadGuard } from '../zone-load-guard.js';
import { selectViewerZoneOption } from '../viewer-zone-selection.js';
import { installMiniMapControls } from '../minimap-controls.js';
import { installOverlayMode } from './overlay-mode.js';
import { installViewerPlayerState, knownViewerLocation } from './player-state.js';

const overlayMode=new URLSearchParams(window.location.search).get('overlay')==='1';
let overlaySlice=null;
if(overlayMode)globalThis.showDirectoryPicker=async()=>{throw new Error('Choose the EverQuest folder in the main Settings.');};

globalThis.EyeOfZommNavigationPolicy = navigationPolicy;

const root = document.getElementById('zone-root');
const app = mountZoneViewer(root, {
    moduleUrl: './ZoneViewerApp.js',
    workerUrl: './zone-parser.worker.js',
    navigationWorkerUrl: './navigation.worker.js',
    height: '100%'
});
configureViewerMovement(app.fp);
app.fp?.setFly?.(true);
window.eqlZoneViewer = app;
installMiniMapControls(app);
const playerState=installViewerPlayerState({app,root,externalSlice:overlayMode});
const viewportFraming = deferHiddenViewportFit(app, () => {
    if (lastSyncedGround) focusTopViewAt(lastSyncedGround);
});

function simplifyViewerUi() {
    root.querySelectorAll('.eqlzv-toolbar .eqlzv-button').forEach(button => {
        const text = String(button.textContent || '').trim();
        if (text === 'Controls' || text === 'Full Screen') button.remove();
    });
}

const trimObserver = new MutationObserver(simplifyViewerUi);
trimObserver.observe(root, { childList:true, subtree:true });
simplifyViewerUi();

app.els?.pathCancel?.addEventListener('click', () => {
    cancelCandidateRoute('cancelled');
    establishedRouteState = { status:'cancelled' };
    window.parent?.postMessage({ type:'eoz-route-cancelled' }, window.location.origin);
});

function playerMapSetLabel(sourceLabel) {
    const source = String(sourceLabel || 'maps').replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
    if (!source || source.toLowerCase() === 'maps') return 'default map set';
    const parts = source.split('/').filter(Boolean);
    return `${parts.at(-1)} map set`;
}

async function localApi(url, options = {}) {
    if(overlayMode&&(!/^\/api\/(?:eq-files|eq-file)(?:\?|$)/.test(url)||!['GET','HEAD'].includes(options.method||'GET')))throw new Error('This viewer can only read selected game files.');
    const next = { cache:'no-store', ...options };
    next.headers = { 'X-Eye-Of-Zomm-Request':'1', ...(next.headers || {}) };
    const response = await fetch(url, next);
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return response;
}

class LocalFileHandle {
    constructor(entry) {
        this.kind = 'file';
        this.name = entry.path.split('/').pop();
        this.entry = entry;
    }

    async readFile() {
        try {
            const response = await localApi(`/api/eq-file?path=${encodeURIComponent(this.entry.path)}${overlayMode?'&surface=overlay-map':''}`);
            const bytes = await response.arrayBuffer();
            return new File([bytes], this.name, { lastModified:Number(this.entry.lastModified) || Date.now() });
        } catch (error) {
            if (overlayMode) throw new Error(`Unable to read local game asset "${this.name}". Check the selected EverQuest folder.`, { cause:error });
            throw error;
        }
    }

    async getFile() {
        const handle = this;
        return {
            name:this.name,
            size:Number(this.entry.size) || 0,
            lastModified:Number(this.entry.lastModified) || 0,
            eyeOfZommReadFile:() => handle.readFile(),
            async arrayBuffer(){ return (await handle.readFile()).arrayBuffer(); },
            async text(){ return (await handle.readFile()).text(); }
        };
    }
}

class LocalDirectoryHandle {
    constructor(name) {
        this.kind = 'directory';
        this.name = name;
        this.children = new Map();
    }

    async *entries() {
        yield* this.children.entries();
    }

    async queryPermission() { return 'granted'; }
    async requestPermission() { return 'granted'; }
}

async function configuredDirectoryHandle() {
    const response = await localApi('/api/eq-files');
    const manifest = await response.json();
    if(overlayMode&&manifest.truncated)throw new Error('The local file inventory is incomplete. Choose the installation folder in the main Settings.');
    if (!manifest.rootName || !Array.isArray(manifest.files)) return null;
    const rootHandle = new LocalDirectoryHandle(manifest.rootName);
    // EQG filesForZone also sweeps <zone>_*.txt. Only its dependency list is
    // parsed as game data; omit other root text rather than attempting reads
    // that the Map partition correctly denies. Main's file index is unchanged.
    const files = overlayMode ? manifest.files.filter(entry => {
        const relative = String(entry.path || '').replace(/\\/g, '/');
        return !/\.txt$/i.test(relative) || /^maps\//i.test(relative) || /^(?:mp3index|[a-z0-9][a-z0-9_-]*_assets)\.txt$/i.test(relative);
    }) : manifest.files;
    rootHandle.eyeOfZommHasZoneArchives = files.some(entry => /\.(?:s3d|eqg)$/i.test(String(entry.path || '')));
    for (const entry of files) {
        const parts = String(entry.path || '').split('/').filter(Boolean);
        if (!parts.length) continue;
        let directory = rootHandle;
        for (const part of parts.slice(0, -1)) {
            const existing = directory.children.get(part);
            if (existing?.kind === 'directory') {
                directory = existing;
            } else {
                const child = new LocalDirectoryHandle(part);
                directory.children.set(part, child);
                directory = child;
            }
        }
        directory.children.set(parts.at(-1), new LocalFileHandle(entry));
    }
    return rootHandle;
}

const HANDLE_DB = 'eoz-zone-viewer';
const HANDLE_STORE = 'directory-handles';
const HANDLE_KEY = 'everquest-root';

function handleStore(mode = 'readonly') {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(HANDLE_DB, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(HANDLE_STORE);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result.transaction(HANDLE_STORE, mode).objectStore(HANDLE_STORE));
    });
}

async function loadSavedHandle() {
    const store = await handleStore();
    return new Promise((resolve, reject) => {
        const request = store.get(HANDLE_KEY);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
    });
}

async function saveHandle(handle) {
    if (!handle) return;
    const store = await handleStore('readwrite');
    await new Promise((resolve, reject) => {
        const request = store.put(handle, HANDLE_KEY);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

async function connectSavedHandle(handle) {
    if (!handle) return false;
    const originalPicker = globalThis.showDirectoryPicker;
    globalThis.showDirectoryPicker = async () => handle;
    try {
        await app.selectDirectory();
        return Boolean(app.source?.directoryHandle);
    } finally {
        if (originalPicker) globalThis.showDirectoryPicker = originalPicker;
        else delete globalThis.showDirectoryPicker;
    }
}

function currentPresentation() {
    return app?.mapFileVisible ? 'map' : (app?.mode === 'first' ? 'first' : 'top');
}

function restorePresentation(mode) {
    if (!app?.currentZoneRecord) return;
    if (mode === 'map' && app.mapData?.lines?.length) {
        if (!app.mapFileVisible) app.setGameMapVisible(true);
        return;
    }
    if (app.mapFileVisible) app.setGameMapVisible(false);
    const viewerMode = mode === 'first' ? 'first' : 'top';
    if (app.mode !== viewerMode) app.setMode(viewerMode);
}

function startRouteWithoutChangingPresentation(start) {
    const presentation = currentPresentation();
    const syncedLocation = lastSyncedLocation;
    const ground = syncedNavigationGround();
    const loggedPose = ground ? {
        position:ground,
        forward:app.lastFirstPersonPose?.forward?.clone?.() || ground.clone().set(0, 0, -1)
    } : null;
    const pending = start();
    const status = app.els?.statusText?.textContent || '';
    const progress = app.els?.progress?.hasAttribute?.('value') ? app.els.progress.value : null;
    restorePresentation(presentation);
    // The upstream label action temporarily enters First and uses lastPick
    // as its spawn. Keep that internal camera transition from moving the
    // player's arrow or the next route start to the previous destination.
    if (loggedPose && lastSyncedLocation === syncedLocation && syncedNavigationGround()) {
        app.lastFirstPersonPose = loggedPose;
        app.lastPick = loggedPose.position.clone();
    }
    if (status) app.setStatus(status, progress);
    return pending;
}

async function pathToWikiLocation(label, location) {
    if (!app?.currentZoneRecord || !Array.isArray(location) || location.length < 2) return false;
    const [worldX, worldY, rawEqZ] = location.map(Number);
    if (![worldX, worldY].every(Number.isFinite)) return false;
    const hasTrustedElevation = Number.isFinite(rawEqZ);
    const eqZ = hasTrustedElevation ? rawEqZ : 0;

    const point = app.eqWorldToThree(worldX, worldY, eqZ);
    // A trusted wiki Z identifies a floor. Starting 35 units above it can hit
    // the next floor in stacked dungeons, so only allow the viewer's normal
    // six-unit step tolerance above the reported elevation.
    const searchHeight = hasTrustedElevation ? point.y : app.currentBounds.max.y + 100;
    const ground = app.findGroundPointAt(point.x, point.z, searchHeight) || point.clone();
    return pathToGroundedLocation(label, point, ground);
}

async function pathToGroundedLocation(label, point, ground) {
    const start = app.navigationStartPoint();
    const key = `${label}:${ground.x.toFixed(2)}:${ground.y.toFixed(2)}:${ground.z.toFixed(2)}`;
    const previous = app.navigationTarget;
    if (previous?.key === key && previous.requestStart && start.distanceToSquared(previous.requestStart) < .0001) return true;

    app.clearNavigationGuide();
    const token = app.navigationBuildToken;
    app.navigationTarget = { key, label, point:point.clone(), ground:ground.clone(), requestStart:start.clone() };
    app.addNavigationBeam(ground, label);
    app.lastPick = ground.clone();
    app.setNavigationBuildActive(true);
    app.setStatus(`Preparing a path to ${label} from your current location…`, .01);
    app.updateNavigationOverlay();
    app.requestRender();
    let route;
    try {
        route = await app.findNavigationPath(start.clone(), ground, token);
    } catch (error) {
        if (token === app.navigationBuildToken) {
            app.setNavigationBuildActive(false);
            app.setStatus(`Unable to calculate a path to ${label}: ${error.message}`, 0);
        }
        return false;
    }
    if (token !== app.navigationBuildToken) return false;
    app.setNavigationBuildActive(false);
    if (route?.length >= 2) {
        app.addNavigationPath(route);
        const distance = route.slice(1).reduce((sum, point, index) => sum + point.distanceTo(route[index]), 0);
        app.setStatus(`Path to ${label} ready · ${Math.round(distance).toLocaleString()} units.`, 0);
    } else {
        app.setStatus(`${label} is marked; no navigable route was found.`, 0);
    }
    app.updateNavigationOverlay();
    app.requestRender();
    renderRouteGuidance();
    return true;
}

function currentRouteGuidance() {
    return routeGuidance(
        Array.isArray(app?.navigationPath) ? app.navigationPath : [],
        lastSyncedGround || app?.lastFirstPersonPose?.position,
        app?.lastFirstPersonPose?.forward
    );
}

function renderRouteGuidance() {
    const guidance = currentRouteGuidance();
    routeGuidanceLayer.hidden = !guidance.active;
    if (!guidance.active) return guidance;
    routeGuidanceCue.textContent = guidance.cue;
    const destination = String(app?.navigationTarget?.label || '').trim();
    routeGuidanceDistance.textContent = `${routeDistanceLabel(guidance.remainingDistance)} units remaining${destination ? ` · ${destination}` : ''}`;
    return guidance;
}

function navigationResult(label, source) {
    const path = Array.isArray(app?.navigationPath) ? app.navigationPath : [];
    const guidance = renderRouteGuidance();
    const distance = guidance.active ? guidance.remainingDistance : path.length >= 2
        ? path.slice(1).reduce((sum, point, index) => sum + point.distanceTo(path[index]), 0)
        : 0;
    return {
        ok:Boolean(app?.navigationTarget),
        source,
        label:app?.navigationTarget?.label || label,
        routed:path.length >= 2,
        distance,
        guidance
    };
}

async function waitForZoneSelect(timeout = 15000) {
    const started = Date.now();
    while (Date.now() - started < timeout) {
        const select = root.querySelector('.eqlzv-zone-select');
        if (select && !select.disabled && select.options.length > 1) return select;
        await new Promise(resolve => setTimeout(resolve, 150));
    }
    return null;
}

let lastSyncedLocation = null;
let lastSyncedGround = null;
let loadedZoneIdentity = '';
function syncedNavigationGround() {
    const identity = `${app.currentZoneRecord?.id || ''}:${app.currentZoneRecord?.format || ''}`;
    return lastSyncedLocation && loadedZoneIdentity && loadedZoneIdentity === identity && lastSyncedGround?.clone
        ? lastSyncedGround.clone()
        : null;
}

const originalNavigationStartPoint = app.navigationStartPoint.bind(app);
app.navigationStartPoint = (...args) => syncedNavigationGround() || originalNavigationStartPoint(...args);

// The camera is grounded for collision/navigation, but the player's readout
// must retain the exact logged elevation in every view and after camera pans.
const originalUpdateCoordinateHud = app.updateCoordinateHud?.bind(app);
app.updateCoordinateHud = (...args) => {
    originalUpdateCoordinateHud?.(...args);
    const identity = `${app.currentZoneRecord?.id || ''}:${app.currentZoneRecord?.format || ''}`;
    if (lastSyncedLocation && loadedZoneIdentity === identity && app.els?.coord) {
        app.els.coord.textContent = `Map ${formatWorldLocationForGameMap(lastSyncedLocation)}`;
    }
};
const headingTracker = new LocationHeadingTracker();
const rareLayer = document.createElement('div');
rareLayer.className = 'eoz-rare-layer';
rareLayer.setAttribute('aria-label', 'Named and rare mobs');
app.els?.viewport?.append(rareLayer);
const routeGuidanceLayer = document.createElement('div');
routeGuidanceLayer.className = 'eoz-route-guidance';
routeGuidanceLayer.hidden = true;
routeGuidanceLayer.setAttribute('aria-label', 'Live route guidance');
const routeGuidanceCue = document.createElement('strong');
const routeGuidanceDistance = document.createElement('small');
routeGuidanceLayer.append(routeGuidanceCue, routeGuidanceDistance);
app.els?.viewport?.append(routeGuidanceLayer);
let rareMobMarkers = [];
let rareGotoEntries = [];
let activeRareMob = '';

function normalizedNpcName(value) {
    return String(value || '').trim().toLowerCase().replace(/['’‘`]/g, '').replace(/[_\s]+/g, ' ');
}

let collisionExportSerial = 0;
let collisionGeometry = null;
let collisionGeometryPromise = null;
let candidateRouteSerial = 0;
let collisionGeometryState = { status:'idle' };
let candidateRouteState = { status:'idle' };
let establishedRouteState = { status:'idle' };

installEstablishedRouteGuard(app, {
    getGeometry:() => collisionGeometry || collisionGeometryPromise,
    getZoneIdentity:() => loadedZoneIdentity,
    onState:state => { establishedRouteState = state; }
});

function finiteMetric(value) {
    if (value === null || value === undefined || value === '') return null;
    const number = Number(value);
    return Number.isFinite(number) ? number : null;
}

function candidateStateFrom(result = {}, previous = candidateRouteState) {
    return {
        ...previous,
        status:String(result.status || previous.status || 'idle'),
        reason:String(result.reason || ''),
        engine:String(result.engine || previous.engine || ''),
        engineVersion:String(result.engineVersion || previous.engineVersion || ''),
        generationMs:finiteMetric(result.generationMs ?? previous.generationMs),
        queryMs:finiteMetric(result.queryMs ?? previous.queryMs),
        totalMs:finiteMetric(result.totalMs ?? previous.totalMs),
        violationCount:finiteMetric(result.violationCount ?? previous.violationCount)
    };
}

const recastRouteClient = new RecastRouteClient({
    onState:state => { candidateRouteState = candidateStateFrom(state); }
});

function plainPoint(point) {
    if (!point || !['x', 'y', 'z'].every(axis => Number.isFinite(Number(point[axis])))) return null;
    return { x:Number(point.x), y:Number(point.y), z:Number(point.z) };
}

function resetSpatialRouteState() {
    collisionExportSerial += 1;
    candidateRouteSerial += 1;
    recastRouteClient.destroy();
    collisionGeometry = null;
    collisionGeometryPromise = null;
    collisionGeometryState = { status:'idle' };
    candidateRouteState = { status:'idle' };
    establishedRouteState = { status:'idle' };
}

function cancelCandidateRoute(reason = 'cancelled') {
    candidateRouteSerial += 1;
    recastRouteClient.cancel(reason, { restartWorker:true });
    candidateRouteState = candidateStateFrom({ status:'cancelled', reason }, { status:'idle' });
}

function startCollisionGeometryExport(zoneIdentity) {
    const serial = ++collisionExportSerial;
    const zone = String(app?.currentZoneRecord?.id || '');
    const format = String(app?.currentZoneRecord?.format || '');
    const startedAt = performance.now();
    collisionGeometry = null;
    collisionGeometryState = { status:'preparing', zone, format };
    collisionGeometryPromise = (async () => {
        // The visible zone is already mounted. Yield once before flattening its
        // collision meshes so loading never waits on candidate path data.
        await new Promise(resolve => setTimeout(resolve, 0));
        const geometry = await exportViewerCollisionGeometry(app.zoneGroup, {
            shouldCancel:() => serial !== collisionExportSerial || zoneIdentity !== loadedZoneIdentity
        });
        if (serial !== collisionExportSerial || zoneIdentity !== loadedZoneIdentity) return null;
        if (!geometry) throw new Error('No finite collision triangles were exported.');
        collisionGeometry = geometry;
        collisionGeometryState = {
            status:'ready',
            zone,
            format,
            buildMs:performance.now() - startedAt,
            sourceMeshes:Number(geometry.stats?.sourceMeshes) || 0,
            vertices:Number(geometry.stats?.vertices) || 0,
            triangles:Number(geometry.stats?.triangles) || 0,
            skippedTriangles:Number(geometry.stats?.skippedTriangles) || 0
        };
        return geometry;
    })().catch(error => {
        if (serial === collisionExportSerial && zoneIdentity === loadedZoneIdentity) {
            collisionGeometryState = {
                status:'error',
                zone,
                format,
                buildMs:performance.now() - startedAt,
                reason:error?.message === 'No finite collision triangles were exported.' ? 'no-collision-geometry' : 'collision-export-failed'
            };
        }
        return null;
    });
}

const zoneLoadGuard = installZoneLoadGuard(app, {
    onRequest() {
        resetSpatialRouteState();
        loadedZoneIdentity = '';
        lastSyncedLocation = null;
        lastSyncedGround = null;
        playerState.clear();
        if(app.renderer)app.renderer.clippingPlanes=[];
        headingTracker.reset();
        clearRareMobs();
        routeGuidanceLayer.hidden = true;
    },
    onReady() {
        loadedZoneIdentity = `${app.currentZoneRecord.id || ''}:${app.currentZoneRecord.format || ''}`;
        app.selectedFloorIndices?.clear?.();
        root.querySelectorAll('[data-eql-floor-index]').forEach(input => { input.checked = false; });
        app.applyFloorSelection?.();
        if(!overlayMode)startCollisionGeometryExport(loadedZoneIdentity);
    }
});

function removeRenderedPath() {
    const group = app?.navigationGuideGroup;
    if (!group?.children) return;
    for (const child of [...group.children]) {
        const routeMesh = String(child.name || '').startsWith('navigation-golden-path') ||
            (Number(child.renderOrder) >= 910 && Number(child.renderOrder) <= 912);
        if (!routeMesh) continue;
        group.remove(child);
        child.traverse?.(object => {
            object.geometry?.dispose?.();
            const materials = Array.isArray(object.material) ? object.material : [object.material];
            materials.filter(Boolean).forEach(material => material.dispose?.());
        });
    }
}

function replacePathWithCandidate(result, label) {
    const template = app?.navigationTarget?.ground || app?.navigationStartPoint?.();
    const points = (result?.path || []).map(point => {
        const value = plainPoint(point);
        return value && template?.clone?.().set(value.x, value.y, value.z);
    }).filter(Boolean);
    if (points.length < 2) return false;
    removeRenderedPath();
    app.navigationPath = [];
    app.addNavigationPath(points);
    app.updateNavigationOverlay?.();
    app.drawMiniMap?.();
    app.requestRender?.();
    const guidance = renderRouteGuidance();
    const distance = guidance.active ? guidance.remainingDistance : points.slice(1)
        .reduce((sum, point, index) => sum + point.distanceTo(points[index]), 0);
    app.setStatus?.(`Path to ${label} updated · ${Math.round(distance).toLocaleString()} units.`, 0);
    window.parent?.postMessage({
        type:'eoz-route-candidate-ready',
        name:String(label || ''),
        distance,
        guidance
    }, window.location.origin);
    return true;
}

function scheduleCandidateRoute(label) {
    const target = app?.navigationTarget;
    const start = plainPoint(target?.requestStart || app?.navigationStartPoint?.());
    const goal = plainPoint(target?.ground);
    if (!target?.key || !start || !goal || !loadedZoneIdentity) return false;
    const serial = ++candidateRouteSerial;
    const zoneIdentity = loadedZoneIdentity;
    const targetKey = target.key;
    const fallbackPath = (app.navigationPath || []).map(plainPoint).filter(Boolean);
    const guidePoints = fallbackPath.length >= 2 ? fallbackPath : [start, goal];
    candidateRouteState = {
        status:collisionGeometry ? 'preparing' : 'waiting-geometry',
        reason:'',
        fallbackAvailable:fallbackPath.length >= 2
    };

    void (async () => {
        const fullGeometry = collisionGeometry || await collisionGeometryPromise;
        if (!fullGeometry || serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey) {
            if (serial === candidateRouteSerial && !fullGeometry) {
                candidateRouteState = candidateStateFrom({ status:'fallback', reason:'collision-geometry-unavailable' });
            }
            return;
        }
        const cropStartedAt = performance.now();
        const cropped = await cropCollisionGeometryForRoute(fullGeometry, guidePoints, {
            // A marker cannot authorize a drop. Established lines have already
            // passed collision checks; otherwise a separate certificate below
            // must prove an exposed descent before any link reaches Recast.
            dropPath:fallbackPath,
            shouldCancel:() => serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey
        });
        if (serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey) return;
        if (!cropped.ok) {
            candidateRouteState = candidateStateFrom({ status:'fallback', reason:cropped.reason }, {
                ...candidateRouteState,
                cropMs:performance.now() - cropStartedAt,
                sourceTriangles:finiteMetric(cropped.stats?.sourceTriangles),
                selectedTriangles:finiteMetric(cropped.stats?.selectedTriangles),
                corridorMargin:finiteMetric(cropped.stats?.margin)
            });
            return;
        }
        const certifiedDrop = fallbackPath.length < 2
            ? await certifyDirectDrop(cropped.geometry, start, goal, {
                shouldCancel:() => serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey
            })
            : { ok:false };
        if (serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey) return;
        candidateRouteState = {
            ...candidateRouteState,
            status:'calculating',
            cropMs:performance.now() - cropStartedAt,
            sourceTriangles:finiteMetric(cropped.stats?.sourceTriangles),
            selectedTriangles:finiteMetric(cropped.stats?.selectedTriangles),
            corridorMargin:finiteMetric(cropped.stats?.margin)
        };
        let result = await recastRouteClient.route({
            geometry:cropped.geometry,
            start,
            goal
        }, {
            rerouting:fallbackPath.length >= 2,
            // Retain the original buffers only for a certified, bounded retry.
            transferGeometry:!certifiedDrop.ok
        });
        if (serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey) return;
        // Preserve a successful ordinary detour. A certified link gets one
        // retry only when an ordinary path is unreachable or independently
        // rejected; worker failures and generation limits keep their fallback.
        if (certifiedDrop.ok && !result.ok && ['goal-unreachable', 'validation-failed'].includes(result.reason)) {
            const first = result;
            result = await recastRouteClient.route({
                geometry:{ ...cropped.geometry, offMeshConnections:[...(cropped.geometry.offMeshConnections || []), certifiedDrop.connection] },
                start,
                goal
            }, { transferGeometry:true });
            if (serial !== candidateRouteSerial || zoneIdentity !== loadedZoneIdentity || app.navigationTarget?.key !== targetKey) return;
            for (const metric of ['generationMs', 'queryMs', 'totalMs']) {
                result[metric] = (Number(first[metric]) || 0) + (Number(result[metric]) || 0);
            }
        }
        candidateRouteState = candidateStateFrom(result, candidateRouteState);
        if (result.ok && !replacePathWithCandidate(result, label)) {
            candidateRouteState = candidateStateFrom({ status:'fallback', reason:'candidate-render-failed' }, candidateRouteState);
        }
    })().catch(() => {
        if (serial === candidateRouteSerial && zoneIdentity === loadedZoneIdentity) {
            candidateRouteState = candidateStateFrom({ status:'fallback', reason:'candidate-orchestration-failed' }, candidateRouteState);
        }
    });
    return true;
}

function clearRareMobs() {
    const oldEntries = new Set(rareGotoEntries);
    app.gotoNpcEntries = (app.gotoNpcEntries || []).filter(entry => !oldEntries.has(entry));
    rareGotoEntries = [];
    rareMobMarkers = [];
    rareLayer.replaceChildren();
}

function renderRareMobs() {
    if (!rareMobMarkers.length) return;
    const visible = Boolean(app?.currentZoneRecord && !app.worldMapVisible);
    const firstPerson = app.mode === 'first' && !app.mapFileVisible;
    const width = Math.max(1, app.els?.viewport?.clientWidth || 1);
    const height = Math.max(1, app.els?.viewport?.clientHeight || 1);
    const cameraPosition = app.camera?.position;
    const candidates = [];
    for (const marker of rareMobMarkers) {
        const distance = cameraPosition?.distanceTo?.(marker.position) ?? 0;
        const projected = marker.position.clone().project(app.camera);
        const onScreen = projected.z >= -1 && projected.z <= 1 && projected.x >= -1.08 && projected.x <= 1.08 && projected.y >= -1.08 && projected.y <= 1.08;
        const correctFloor = overlayMode ? !marker.hasZ||!overlaySlice||Math.abs(marker.eqZ-overlaySlice.center)<=overlaySlice.tolerance : !app.floorSelectionContainsY || app.floorSelectionContainsY(marker.eqZ);
        if (!visible || !onScreen || !correctFloor || (firstPerson && distance > 1800)) {
            marker.element.hidden = true;
            continue;
        }
        const x = (projected.x * .5 + .5) * width;
        const y = (-projected.y * .5 + .5) * height;
        candidates.push({ marker, x, y, distance, center:Math.hypot(x - width / 2, y - height / 2) });
    }
    candidates.sort((left, right) =>
        Number(right.marker.active) - Number(left.marker.active) ||
        right.marker.priority - left.marker.priority ||
        (firstPerson ? left.center - right.center : left.distance - right.distance)
    );
    const occupied = [];
    const limit = firstPerson ? 28 : 70;
    let shown = 0;
    for (const candidate of candidates) {
        const markerWidth = Math.min(220, 64 + candidate.marker.name.length * 7);
        const box = { left:candidate.x - markerWidth / 2, right:candidate.x + markerWidth / 2, top:candidate.y - 28, bottom:candidate.y + 3 };
        const overlaps = occupied.some(other => !(box.right < other.left || box.left > other.right || box.bottom < other.top || box.top > other.bottom));
        if (shown >= limit || (overlaps && !candidate.marker.active)) {
            candidate.marker.element.hidden = true;
            continue;
        }
        occupied.push(box);
        shown += 1;
        candidate.marker.element.hidden = false;
        candidate.marker.element.style.transform = `translate(-50%, -100%) translate(${candidate.x.toFixed(1)}px, ${candidate.y.toFixed(1)}px)`;
        candidate.marker.element.style.opacity = firstPerson ? String(Math.max(.46, 1.08 - candidate.distance / 1800)) : '1';
    }
}

const originalRenderFrame = app.renderFrame?.bind(app);
if (originalRenderFrame) {
    app.renderFrame = (...args) => {
        const result = originalRenderFrame(...args);
        renderRareMobs();
        return result;
    };
}

function focusTopViewAt(point) {
    const target = app?.orbit?.target;
    const camera = app?.perspective;
    if (!point?.clone || !target?.clone || !camera?.position) return false;
    const previous = target.clone();
    const deltaX = point.x - previous.x;
    const deltaY = point.y - previous.y;
    const deltaZ = point.z - previous.z;
    camera.position.x += deltaX;
    camera.position.y += deltaY;
    camera.position.z += deltaZ;
    target.copy(point);
    app.orbit?.update?.();
    app.lastPick = point.clone();
    app.updateCoordinateHud?.(true);
    app.drawMapLabels?.();
    app.requestRender?.();
    return true;
}

window.eqlEyeOfZommViewer = {
    async selectFolder() {
        if (!app) return { ok:false };
        if(overlayMode)return {ok:false,reason:'choose-folder-in-main-settings'};
        try {
            await localApi('/api/select-eq-root', { method:'POST' });
            const configured = await configuredDirectoryHandle();
            if (configured && await connectSavedHandle(configured)) {
                return { ok:true, restored:true, name:configured.name || '' };
            }
        } catch {}
        const saved = await loadSavedHandle().catch(() => null);
        if (saved) {
            let permission = await saved.queryPermission?.({ mode:'read' });
            if (permission !== 'granted') permission = await saved.requestPermission?.({ mode:'read' });
            if (permission === 'granted' && await connectSavedHandle(saved)) {
                return { ok:true, restored:true, name:saved.name || '' };
            }
        }
        await app.selectDirectory();
        const handle = app.source?.directoryHandle;
        if (handle) await saveHandle(handle).catch(() => {});
        return { ok:Boolean(handle), restored:false, name:handle?.name || '' };
    },

    async useConfiguredFolder() {
        if (!app) return { ok:false };
        const configured = await configuredDirectoryHandle().catch(() => null);
        if (configured) {
            if (!configured.eyeOfZommHasZoneArchives) {
                return { ok:false, reason:'no-zone-archives', name:configured.name || '', source:'settings' };
            }
            const ok = await connectSavedHandle(configured);
            if (ok) {
                const select = app.els?.zoneSelect || await waitForZoneSelect(3000);
                if (select && !select.disabled && select.options.length > 1) {
                    return { ok:true, restored:true, name:configured.name || '', source:'settings' };
                }
                return { ok:false, reason:'no-zone-archives', name:configured.name || '', source:'settings' };
            }
            return { ok:false, reason:'folder-open-failed', name:configured.name || '', source:'settings' };
        }
        if(overlayMode)return {ok:false,reason:'choose-folder-in-main-settings'};
        const handle = await loadSavedHandle().catch(() => null);
        if (!handle) return { ok:false, reason:'no-saved-folder' };
        const permission = await handle.queryPermission?.({ mode:'read' });
        if (permission !== 'granted') return { ok:false, reason:'permission-required', name:handle.name || '' };
        const ok = await connectSavedHandle(handle);
        return { ok, restored:ok, name:handle.name || '', source:'saved-handle' };
    },

    async loadZone(zoneName) {
        if (!app) return { ok:false, reason:'viewer-not-mounted' };
        const select = app.els?.zoneSelect || await waitForZoneSelect();
        if (!select) return { ok:false, reason:'select-eq-folder-first' };
        if (select.disabled || select.options.length <= 1) return { ok:false, reason:'select-eq-folder-first' };

        const option = selectViewerZoneOption(select.options, zoneName);
        if (!option) return { ok:false, reason:'zone-not-found', zone:zoneName };

        if (select.value !== option.value) {
            clearRareMobs();
            select.value = option.value;
            select.dispatchEvent(new Event('change', { bubbles:true }));
        }

        const selected = app.selectedZoneRecord?.();
        const alreadyLoaded = zoneLoadGuard.isReady(selected) && app.currentZoneRecord && selected &&
            app.currentZoneRecord.id === selected.id && app.currentZoneRecord.format === selected.format;
        if (!alreadyLoaded) {
            const result = await app.loadSelectedZone();
            if (result?.reason === 'superseded') return { ok:false, reason:'superseded' };
        }
        if (!selected || !zoneLoadGuard.isReady(selected) || !app.currentZoneRecord ||
            app.currentZoneRecord.id !== selected.id || app.currentZoneRecord.format !== selected.format) {
            return {
                ok:false,
                reason:'load-failed',
                message:app.els?.statusText?.textContent || `Unable to load ${zoneName}.`
            };
        }
        if (!overlayMode && !collisionGeometryPromise) {
            startCollisionGeometryExport(loadedZoneIdentity);
        }
        return {
            ok:true,
            viewerZone:option.textContent,
            status:app.els?.statusText?.textContent || 'Zone ready'
        };
    },

    syncLocation(location, options = {}) {
        if (!app || !knownViewerLocation(location)) {
            return { ok:false, reason:'no-location' };
        }
        if (!app.fp || !app.perspective || !app.currentBounds || !app.currentZoneRecord) {
            return { ok:false, reason:'load-zone-first' };
        }
        if(!loadedZoneIdentity||!zoneLoadGuard.isReady(app.currentZoneRecord))return {ok:false,reason:'load-zone-first'};

        // Logged locations are world X/Y/Z. Client map files have a separate
        // signed basis and use eqMapToThree instead.
        const observation=playerState.observe(location);
        if(!observation.ok)return observation;
        const worldLocation = observation.world;
        const point = app.eqWorldToThree(worldLocation.x, worldLocation.y, worldLocation.z);
        // /loc Z is authoritative. A large upward ray offset can snap to the
        // ceiling or next floor (Befallen's adjacent floors are ~33 units
        // apart), while findGroundPointAt already permits the six-unit step
        // tolerance configured for player movement.
        const ground = observation.ground;
        lastSyncedGround = ground.clone();
        const movement = headingTracker.push(worldLocation, Number(options.timestamp) || Date.now());
        const previousForward = app.lastFirstPersonPose?.forward?.clone?.();
        let forward = previousForward;
        if (movement.heading) {
            const headingPoint = app.eqWorldToThree(
                worldLocation.x + movement.heading.x,
                worldLocation.y + movement.heading.y,
                worldLocation.z
            );
            const mappedHeading = headingPoint.clone().sub(point).setY(0);
            if (mappedHeading.lengthSq() > .0001) forward = mappedHeading.normalize();
        }
        if (!forward?.lengthSq?.()) forward = ground.clone().set(0, 0, -1);

        const moveCamera=options.moveCamera!==false;
        const requestedMode = moveCamera&&['first', 'top', 'map'].includes(options.mode) ? options.mode : (app.mapFileVisible ? 'map' : app.mode);
        const resolvedMode = requestedMode === 'map' && !app.mapData?.lines?.length ? 'top' : requestedMode;
        if (moveCamera&&resolvedMode === 'map') {
            if (!app.mapFileVisible) app.setGameMapVisible(true);
        } else if(moveCamera) {
            if (app.mapFileVisible) app.setGameMapVisible(false);
            if (app.mode !== resolvedMode) app.setMode(resolvedMode === 'top' ? 'top' : 'first');
        }

        if(moveCamera)app.lastFirstPersonPose = { position:ground.clone(), forward:forward.clone() };
        if (moveCamera&&resolvedMode === 'first') {
            app.perspective.position.copy(ground).add({ x:0, y:app.fp.eyeHeight || 6, z:0 });
            app.perspective.up.set(0, 1, 0);
            app.perspective.lookAt(app.perspective.position.clone().add(forward));
            app.fp.activate(app.perspective.position);
            app.captureFirstPersonPose?.();
            app.setMiniMapVisible?.(true);
        } else if(moveCamera) {
            focusTopViewAt(ground);
        }
        lastSyncedLocation = worldLocation;
        if (typeof app.updateCoordinateHud === 'function') app.updateCoordinateHud(true);
        if (resolvedMode !== 'first' && typeof app.drawMiniMap === 'function') app.drawMiniMap();
        if (typeof app.setStatus === 'function') {
            app.setStatus(`Synced to in-game map ${formatWorldLocationForGameMap(worldLocation)} · ${playerMapSetLabel(app.mapData?.sourceLabel)}.${observation.grounded?'':' Player marker uses logged elevation; ground unavailable.'}`);
        }
        app.requestRender?.();
        renderRareMobs();
        const guidance = renderRouteGuidance();
        return { ok:true, moved:movement.moved, heading:movement.heading, mode:resolvedMode, guidance,grounded:observation.grounded };
    },

    clearPlayerLocation(){
        lastSyncedLocation=null;lastSyncedGround=null;headingTracker.reset();playerState.clear();app.updateCoordinateHud?.(true);return {ok:true};
    },
    setAutoZ(enabled,options={}){return playerState.setAutoZ(enabled,options);},

    setRareMobs(records = []) {
        clearRareMobs();
        if (!app?.currentZoneRecord || !Array.isArray(records)) return { ok:false, count:0 };
        if (app.els?.namedMobs) app.els.namedMobs.checked = false;
        app.updateNamedMobLabels?.();
        const seen = new Set();
        for (const record of records) {
            const name = String(record?.name || '').trim();
            const location = Array.isArray(record?.loc) ? record.loc.map(Number) : [];
            if (!name || location.length < 2 || !location.slice(0, 2).every(Number.isFinite)) continue;
            const key = String(record.id||`${normalizedNpcName(name)}|${record.raidInstance?'raid':'normal'}`);
            if (seen.has(key)) continue;
            seen.add(key);
            const hasZ = (typeof record.loc?.[2]==='number'||typeof record.loc?.[2]==='string'&&record.loc[2].trim()!=='')&&Number.isFinite(location[2]);
            const eqZ = hasZ ? location[2] : 0;
            const point = app.eqWorldToThree(location[0], location[1], eqZ);
            const ground = app.findGroundPointAt(point.x, point.z, hasZ ? point.y : app.currentBounds.max.y + 100) || point;
            const resolvedEqZ = hasZ ? eqZ : Number(app.threeToEq?.(ground)?.z) || 0;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'eoz-rare-marker';
            if(overlayMode&&record.raidInstance)button.classList.add('is-raid');
            button.title = `Select ${name} · ${record.raidInstance?'Raid':'Normal'} Zone${hasZ?'':' · height unknown'}${record.dropCount ? ` · ${record.dropCount} known drops` : ''}`;
            button.dataset.npc = name;
            button.append(document.createTextNode(name));
            if (record.classDropCount || record.dropCount) {
                const count = document.createElement('small');
                count.textContent = `${Number(record.classDropCount) || Number(record.dropCount)} loot`;
                button.append(count);
            }
            button.addEventListener('click', event => {
                event.stopPropagation();
                window.parent?.postMessage({ type:'eoz-rare-mob-selected', name,id:record.id,raidInstance:!!record.raidInstance }, window.location.origin);
            });
            rareLayer.append(button);
            const marker = {
                element:button,
                id:record.id,raidInstance:!!record.raidInstance,hasZ,
                name,
                eqZ:overlayMode&&!hasZ?null:resolvedEqZ,
                position:ground.clone().add({ x:0, y:8, z:0 }),
                priority:(Number(record.classDropCount) || 0) * 20 + (Number(record.dropCount) || 0),
                active:normalizedNpcName(name) === normalizedNpcName(activeRareMob)
            };
            rareMobMarkers.push(marker);
            // The viewer's goto catalog stores client-map coordinates even
            // though wiki records and our marker positions start in world X/Y.
            const mapPoint = worldToClientMap({ x:location[0], y:location[1], z:resolvedEqZ });
            const gotoEntry = {
                label:name,
                rawLabel:name,
                search:name.toLowerCase(),
                point:{ ...mapPoint, label:name, size:2 }
            };
            app.gotoNpcEntries.push(gotoEntry);
            rareGotoEntries.push(gotoEntry);
        }
        renderRareMobs();
        app.requestRender?.();
        return { ok:true, count:rareMobMarkers.length };
    },

    setActiveRareMob(name = '') {
        activeRareMob = String(name || '');
        for (const marker of rareMobMarkers) {
            marker.active = normalizedNpcName(marker.name) === normalizedNpcName(activeRareMob);
            marker.element.classList.toggle('is-active', marker.active);
        }
        renderRareMobs();
        return { ok:true };
    },

    setView(mode) {
        if (!app?.currentZoneRecord) return { ok:false, reason:'load-zone-first', message:'Load the current zone first.' };
        if (mode === 'map') {
            if (!app.mapData?.lines?.length) {
                return { ok:false, reason:'map-not-found', message:'No matching file was found in the EverQuest Maps folder.' };
            }
            app.setGameMapVisible(true);
            if (!focusTopViewAt(lastSyncedGround)) app.resetTopView?.();
            return { ok:true, mode:'map' };
        }
        app.setGameMapVisible?.(false);
        app.setMode(mode === 'top' ? 'top' : 'first');
        if (mode === 'top') focusTopViewAt(lastSyncedGround);
        return { ok:true, mode:mode === 'top' ? 'top' : 'first' };
    },

    async pathTo(label, wikiLocation = null) {
        if(overlayMode)return {ok:false,reason:'routing-owned-by-main'};
        if (!app?.currentZoneRecord || !label) return { ok:false };
        // Invalidate a previous-start candidate before awaiting the line
        // worker, including when the destination key will stay the same.
        cancelCandidateRoute('rerouting');
        const wanted = normalizedNpcName(label);
        const hasLocalMapLabel = (app.gotoNpcEntries || []).some(entry =>
            !rareGotoEntries.includes(entry) && normalizedNpcName(entry.label) === wanted
        );
        const previousTarget = app.navigationTarget;
        const pending = startRouteWithoutChangingPresentation(() => app.gotoNpcLabel(String(label), { teleport:false }));
        const token = app.navigationBuildToken;
        let ok;
        try {
            ok = await pending;
        } catch (error) {
            if (token !== app.navigationBuildToken) return { ok:false, source:'' };
            throw error;
        }
        // A cancelled/superseded map request returns false too. It must not
        // recreate the old destination through the wiki-location fallback.
        if (token !== app.navigationBuildToken) return { ok:false, source:'' };
        if (ok) {
            // The upstream label router caches by destination only. Reuse its
            // resolved map point, but refresh a cached target from the newest
            // logged start before scheduling the spatial candidate.
            if (previousTarget && app.navigationTarget === previousTarget &&
                !await pathToGroundedLocation(previousTarget.label, previousTarget.point, previousTarget.ground)) {
                return { ok:false, source:'' };
            }
            const result = navigationResult(String(label), hasLocalMapLabel ? 'map-label' : 'wiki-location');
            scheduleCandidateRoute(result.label || String(label));
            return result;
        }
        const wikiOk = await pathToWikiLocation(String(label), wikiLocation);
        if (!wikiOk) return { ok:false, source:'' };
        const result = navigationResult(String(label), 'wiki-location');
        scheduleCandidateRoute(result.label || String(label));
        return result;
    },

    clearPath() {
        if (!app) return { ok:false };
        cancelCandidateRoute('cleared');
        establishedRouteState = { status:'idle' };
        app.clearNavigationGuide?.();
        app.updateNavigationOverlay?.();
        app.drawMiniMap?.();
        app.requestRender?.();
        routeGuidanceLayer.hidden = true;
        return { ok:true };
    },

    setOverlaySelection(id) {
        if(!overlayMode)return {ok:false};
        for(const marker of rareMobMarkers){marker.active=marker.id===id;marker.element.classList.toggle('is-active',marker.active);}
        renderRareMobs();return {ok:true};
    },

    overlayNavigation() {
        // Export only a collision-validated route. Destinations alone are markers.
        const path = app?.navigationPath;
        const ready = establishedRouteState.status === 'ready' || candidateRouteState.status === 'ready';
        const select = root.querySelector('.eqlzv-zone-select');
        const selected = select?.selectedOptions?.[0];
        if (!ready || !app?.navigationTarget || !app?.currentZoneRecord ||
            !zoneLoadGuard.isReady(app.currentZoneRecord) ||
            (selected && String(selected.value).toUpperCase() !== `${app.currentZoneRecord.format}:${app.currentZoneRecord.id}`.toUpperCase()) ||
            !Array.isArray(path) || path.length < 2 || path.length > 5000) return null;
        const points = path.map(point => ({x:point.z,y:-point.x,z:point.y}));
        return points.every(point => Object.values(point).every(Number.isFinite)) ? {points} : null;
    },

    status() {
        const select = root.querySelector('.eqlzv-zone-select');
        const badge = root.querySelector('.eqlzv-zone-badge');
        return {
            mounted: Boolean(app),
            directorySelected: Boolean(select && !select.disabled),
            zone: app?.currentZoneRecord ? (badge ? badge.textContent.trim() : app.currentZoneRecord.id) : '',
            mode: app?.mapFileVisible ? 'map' : (app?.mode || 'top'),
            floors: app?.selectedFloorIndices?.size ? 'filtered' : 'all',
            playerMarker:playerState.status(),
            textures:{
                available:Number(app?.parserStats?.textures || 0),
                materials:Number(app?.loadedMaterials?.length || 0),
                resolved:Number(app?.loadedMaterials?.filter?.(material => material?.userData?.eqlLocalTexturePath).length || 0)
            },
            navigation:navigationResult('', app?.navigationTarget ? 'active' : ''),
            spatial:{
                established:{ ...establishedRouteState },
                collision:{ ...collisionGeometryState },
                candidate:{ ...candidateRouteState }
            },
            message:app?.els?.statusText?.textContent || ''
        };
    },

    resize() {
        viewportFraming.resize();
        return { ok:Boolean(app) };
    }
};

if(overlayMode){
    installOverlayMode({app,root,api:window.eqlEyeOfZommViewer,onSlice:value=>{overlaySlice=value;renderRareMobs();}});
    // Mode is owned by the native Map header. Movement keys and pointer-lock
    // navigation remain local to this iframe; no gameplay input is produced.
    window.addEventListener('keydown',event=>{if(['Digit1','Digit2','Digit3','KeyM'].includes(event.code)){event.preventDefault();event.stopImmediatePropagation();}},true);
}

window.addEventListener('beforeunload', resetSpatialRouteState, { once:true });
window.addEventListener('beforeunload',()=>playerState.dispose(),{once:true});
window.parent?.postMessage({ type:'eoz-viewer-ready' }, window.location.origin);
</script>
