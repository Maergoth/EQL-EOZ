name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-bootstrap:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Determine release channel and preserve existing tag provenance
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          prerelease=false
          [[ "$version" == 0.* || "$version" == *-* ]] && prerelease=true
          publish=true
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag" || { echo "Tag must match package version $tag"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            publish=false
            echo "Preserving existing $tag; this main commit will build artifacts without replacing its release."
          elif [[ "$version" != 0.* ]]; then
            publish=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Fetch one verified production bootstrap for both platforms
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Snapshot shared wiki formulas once for this app release
        run: node scripts/sync-item-scaling.mjs --from-wiki-main
      - name: Share the fixed formula snapshot for both platforms
        uses: actions/upload-artifact@v4
        with:
          name: EoZ-release-item-scaling
          path: app/vendor/item-scaling-*
          if-no-files-found: error
      - name: Share the public filtered release bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: EoZ-release-bootstrap
          path: app/data/eye-of-zomm-pack.bootstrap.json
          if-no-files-found: error

  release-windows:
    needs: prepare-bootstrap
    uses: ./.github/workflows/build-windows.yml
    with:
      bootstrap_artifact: EoZ-release-bootstrap
      item_scaling_artifact: EoZ-release-item-scaling
      extended_ui_checks: false
    secrets: inherit

  release-linux:
    needs: prepare-bootstrap
    uses: ./.github/workflows/build-linux.yml
    with:
      bootstrap_artifact: EoZ-release-bootstrap
      item_scaling_artifact: EoZ-release-item-scaling
      extended_ui_checks: false

  publish:
    needs: [ prepare-bootstrap, release-windows, release-linux ]
    if: needs.prepare-bootstrap.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare-bootstrap.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.prepare-bootstrap.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download both verified platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EQLWiki-Eye-of-Zomm-*-x64
          merge-multiple: true
          path: dist
      - name: Download the same formula source receipt for release notes
        uses: actions/download-artifact@v4
        with:
          name: EoZ-release-item-scaling
          path: app/vendor
      - name: Verify fixed formula source provenance
        run: node scripts/sync-item-scaling.mjs --check
      - name: Verify complete release asset set and checksums
        run: |
          node scripts/release-assets.mjs win32 --verify
          node scripts/release-assets.mjs linux --verify
          node scripts/release-assets.mjs --notes --source-commit "$GITHUB_SHA"
      - name: Publish one release after both platforms pass
        shell: bash
        run: |
          tagged="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)"
          if [[ -z "$tagged" ]]; then tagged="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"; fi
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "Refusing to replace assets for $RELEASE_TAG from a different source commit."
            exit 1
          fi
          assets=(dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe dist/EQLWiki-Eye-of-Zomm-*-x64.AppImage dist/EQLWiki-Eye-of-Zomm-*-x64.deb dist/SHA256SUMS-*-x64.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [[ "$draft" != true ]]; then
              mkdir published-assets
              for asset in "${assets[@]}"; do
                gh release download "$RELEASE_TAG" --pattern "$(basename "$asset")" --dir published-assets
              done
              node scripts/release-assets.mjs win32 --verify --directory published-assets
              node scripts/release-assets.mjs linux --verify --directory published-assets
              cmp dist/SHA256SUMS-Windows-x64.txt published-assets/SHA256SUMS-Windows-x64.txt
              cmp dist/SHA256SUMS-Linux-x64.txt published-assets/SHA256SUMS-Linux-x64.txt
              echo "Complete published release matches; preserving every existing asset."
              exit 0
            fi
            body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            [[ "$body" == *"Build source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"* ]] || { echo 'Refusing to repair a draft without matching source ownership.'; exit 1; }
            formula_sha="$(node -p "require('./app/vendor/item-scaling-source.json').commit")"
            [[ "$body" == *"Shared item formulas: https://github.com/Maergoth/EQLWiki/commit/$formula_sha "* ]] || { echo 'Refusing to repair a draft with different wiki formulas.'; exit 1; }
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            channel=()
            [[ "$RELEASE_PRERELEASE" == true ]] && channel+=(--prerelease)
            [[ "$RELEASE_PRERELEASE" == true ]] && channel+=(--latest=false)
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --draft --title "Eye of Zomm $RELEASE_TAG" --generate-notes --notes-file dist/RELEASE_NOTES.md "${channel[@]}"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
