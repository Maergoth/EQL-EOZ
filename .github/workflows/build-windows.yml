name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Fetch production bootstrap data
        shell: bash
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Require signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_PFX_BASE64 is required; unsigned installers are not published.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required; unsigned installers are not published.'
          }
      - name: Configure Authenticode certificate
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'eye-of-zomm-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "CSC_LINK=$certificatePath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - name: Build NSIS installer
        run: npm run dist:win
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-Item 'dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe'
          $application = Get-Item 'dist/win-unpacked/EQLWiki - Eye of Zomm.exe'
          foreach ($file in @($application, $installer)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status)" }
            $signature | Format-List Status,StatusMessage,SignerCertificate
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQLWiki-Eye-of-Zomm-Windows-x64
          path: dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe
          if-no-files-found: error
