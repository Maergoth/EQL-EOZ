name: Windows installer

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bootstrap_artifact:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm run audit:deps
      - name: Test
        run: npm test
      - name: Test actual desktop CSP and browser worker
        run: npm run test:desktop-worker
      - name: Test native overlay windows
        run: npm run test:native-overlays
      - name: Test all-panel native resize and touching overlay docks
        run: npm run test:overlay-resize
      - name: Test Intel ordering and viewport stability
        run: npm run test:intel-stability
      - name: Test main window placement and startup
        run: npm run test:window-lifecycle
      - name: Test map sizing and zoom
        run: npm run test:map-layout
      - name: Test map marker loot pane and instance identity
        run: npm run test:map-loot
      - name: Test Character persistence across restarts and changed origins
        run: npm run test:character-storage
      - name: Test cached frontend upgrade recovery
        run: npm run test:main-cache
      - name: Test native Map 3D and file isolation
        run: npm run test:map-overlay-3d
      - name: Test inline wiki discovery and explicit clipboard capture
        run: npm run test:discovery-notices
      - name: Test native appearance controls
        run: npm run test:appearance
      - name: Test hardened wiki login and guarded writes with a loopback fixture
        run: npm run test:wiki-auth
      - name: Test persistent source capture and local OCR
        run: npm run test:capture-native
      - name: Test tooltip priority with moving scenes and full-resolution pixel streams
        run: npm run test:capture-priority
      - name: Test Default Modern pane geometry through real offline OCR
        run: npm run test:modern-ocr
      - name: Test compact hover tooltips and mixed panes through real offline OCR
        run: npm run test:hover-ocr
      - name: Test OCR area calibration controls and saved source regions
        run: npm run test:capture-calibration
      - name: Test contribution and character workflows with a loopback wiki
        run: npm run test:capture-workspace
      - name: Test current contribution and Character UI
        run: npm run test:workspace-099
      - name: Test guided Character capture and base-only estimates
        run: npm run test:character-walkthrough
      - name: Test installed system fonts and changed-stat colors
        run: npm run test:system-fonts
      - name: Fetch production bootstrap data
        if: inputs.bootstrap_artifact == ''
        shell: bash
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Download shared verified release bootstrap
        if: inputs.bootstrap_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bootstrap_artifact }}
          path: app/data
      - name: Test production catalog relevance
        run: npm run test:catalog
      - name: Determine signing mode
        id: signing
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw 'Configure both Windows signing secrets or neither of them.'
          }
          $enabled = $hasCertificate -and $hasPassword
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            '### Warning: unsigned Windows build' >> $env:GITHUB_STEP_SUMMARY
            'No Authenticode certificate is configured. Windows may show an Unknown publisher or SmartScreen warning.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Configure Authenticode certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'eye-of-zomm-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "CSC_LINK=$certificatePath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - name: Build NSIS installer
        run: npm run dist:win
      - name: Verify packaged version and coordinate code
        run: npm run test:artifact
      - name: Test packaged capture host and physical offline OCR resources
        run: npm run test:capture-native -- --packaged-root dist/win-unpacked/resources/app.asar
      - name: Test installed fonts in the verified packaged ASAR
        run: npm run test:system-fonts -- --packaged-root dist/win-unpacked/resources/app.asar
      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installer = Get-Item 'dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe'
          $application = Get-Item 'dist/win-unpacked/EQLWiki - Eye of Zomm.exe'
          foreach ($file in @($application, $installer)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status)" }
            $signature | Format-List Status,StatusMessage,SignerCertificate
          }
      - name: Hash release assets
        run: node scripts/release-assets.mjs win32
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQLWiki-Eye-of-Zomm-Windows-x64
          path: |
            dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe
            dist/SHA256SUMS-Windows-x64.txt
          if-no-files-found: error
