name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm run audit:deps
      - name: Test
        run: npm test
      - name: Fetch production bootstrap data
        shell: bash
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Test production catalog relevance
        run: npm run test:catalog
      - name: Determine signing mode
        id: signing
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw 'Configure both Windows signing secrets or neither of them.'
          }
          $enabled = $hasCertificate -and $hasPassword
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            '### Warning: unsigned Windows build' >> $env:GITHUB_STEP_SUMMARY
            'No Authenticode certificate is configured. Windows may show an Unknown publisher or SmartScreen warning.' >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Configure Authenticode certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'eye-of-zomm-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "CSC_LINK=$certificatePath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - name: Build NSIS installer
        run: npm run dist:win
      - name: Verify Authenticode signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installer = Get-Item 'dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe'
          $application = Get-Item 'dist/win-unpacked/EQLWiki - Eye of Zomm.exe'
          foreach ($file in @($application, $installer)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) signature is $($signature.Status)" }
            $signature | Format-List Status,StatusMessage,SignerCertificate
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQLWiki-Eye-of-Zomm-Windows-x64
          path: dist/EQLWiki-Eye-of-Zomm-Setup-*-x64.exe
          if-no-files-found: error
