name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:deps
      - run: npm test
      - name: Fetch production bootstrap data
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Test production catalog relevance
        run: npm run test:catalog

  desktop-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Test full Windows source suite
        run: npm test
      - run: npm run test:desktop-worker
      - run: npm run test:window-lifecycle
      - run: npm run test:map-layout
      - run: npm run test:map-location-latency -- --screenshots ci-screenshots/map-location-latency
      - run: npm run test:map-loot -- --screenshots ci-screenshots/map-loot
      - run: npm run test:character-storage
      - run: npm run test:character-repository -- --screenshots ci-screenshots/character-repository
      - run: npm run test:main-cache
      - run: npm run test:map-overlay-3d
      - run: npm run test:native-overlays -- --screenshots ci-screenshots
      - run: npm run test:combatant-overview -- --screenshots ci-screenshots/combatant-overview
      - run: npm run test:overlay-resize
      - run: npm run test:intel-stability
      - run: npm run test:discovery-notices
      - run: npm run test:appearance -- --screenshots ci-screenshots/appearance
      - run: npm run test:wiki-auth
      - run: npm run test:capture-native
      - run: npm run test:capture-priority
      - run: npm run test:modern-ocr
      - run: npm run test:default-ocr
      - run: npm run test:hover-ocr
      - run: npm run test:capture-calibration -- --screenshots ci-screenshots/capture-calibration
      - run: npm run test:capture-workspace -- --screenshots ci-screenshots/capture-workspace
      - run: npm run test:discovery-capture-workspace
      - run: npm run test:discovery-queue-stability
      - run: npm run test:screen-reading-master
      - run: npm run test:character-screenshot -- --screenshots ci-screenshots/character-screenshot
      - run: npm run test:chat-item-boundaries -- --screenshots ci-screenshots/chat-boundaries
      - run: npm run test:consider-level-workspace
      - run: npm run test:zone-creation-workspace -- --screenshots ci-screenshots/zone-creation
      - run: npm run test:workspace-099
      - run: npm run test:character-walkthrough -- --screenshots ci-screenshots/character-walkthrough
      - run: npm run test:system-fonts -- --screenshots ci-screenshots/system-fonts
      - name: Upload synthetic interface captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EoZ-interface-captures
          path: ci-screenshots/**/*.png
          if-no-files-found: ignore

  linux-desktop:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-linux.yml
