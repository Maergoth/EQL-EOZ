name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:deps
      - run: npm test
      - name: Fetch production bootstrap data
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Test production catalog relevance
        run: npm run test:catalog

  desktop-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Test full Windows source suite
        run: npm test
      - run: npm run test:desktop-worker
      - run: npm run test:window-lifecycle
      - run: npm run test:map-layout
      - run: npm run test:map-overlay-3d
      - run: npm run test:native-overlays -- --screenshots ci-screenshots
      - run: npm run test:discovery-notices
      - run: npm run test:appearance -- --screenshots ci-screenshots/appearance
      - name: Upload synthetic interface captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EoZ-interface-captures
          path: ci-screenshots/**/*.png
          if-no-files-found: ignore

  linux-desktop:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build-linux.yml
