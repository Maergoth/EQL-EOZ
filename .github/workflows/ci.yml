name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:deps
      - run: npm test
      - name: Fetch production bootstrap data
        run: node scripts/fetch-bootstrap-pack.mjs --required
      - name: Test production catalog relevance
        run: npm run test:catalog
